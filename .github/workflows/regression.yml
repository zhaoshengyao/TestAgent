# =====================================================================
# GitHub Actions CI：PR smoke + nightly full
#
# 触发：
#   - PR / push 到 main → smoke_login.yaml（~5min，PR 门禁）
#   - 每天 UTC 22:00 → demo_checkout.yaml（~30min，nightly 全量）
#   - 手动 Run workflow → 可选 smoke / nightly
#
# 依赖：
#   - GitHub Secret DEEPSEEK_API_KEY
#   - ubuntu-latest + Node + npx playwright install（官方推荐方式）
#
# exit code 翻译（scripts/ci_run.py）：
#   CLI 0 / 2 → CI 绿，CLI 1 → CI 红
#
# 注意：不走 pip install -e . —— editable install 在 CI checkout 嵌两层
# 时会指到错误路径，产生 __editable__.stagent finder hook 劫持 import。
# selftest / ci_run.py 自己做 Path(__file__).resolve().parents[1] 插入 sys.path。
# =====================================================================

name: TestAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: 跑哪种
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - nightly

jobs:
  # =====================================================================
  # Job 1：smoke（PR / push / 手动选 smoke）
  # =====================================================================
  smoke:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.inputs.run_type == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright system deps + MCP 浏览器
        run: |
          # 先装 Chromium system deps（libgtk / xvfb / fonts 等）
          npx playwright install-deps chromium 2>&1 || true
          # 再装 @playwright/mcp 需要的 chrome-for-testing（它用的不是普通 Chromium）
          npx @playwright/mcp install-browser chrome-for-testing

      - name: Setup CI config
        run: cp config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run smoke_login.yaml
        id: run
        env:
          STAGENT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/ci_run.py suites/smoke_login.yaml; echo "exit_code=$?"

      - name: Print report on failure
        if: steps.run.outcome != 'success'
        run: |
          echo "=== artifacts dir ==="
          find artifacts -type f 2>/dev/null || echo "no artifacts"
          echo ""
          echo "=== report.md ==="
          cat artifacts/runs/*/report.md 2>/dev/null || echo "no report.md"
          echo ""
          echo "=== summary.json ==="
          cat artifacts/runs/*/summary.json 2>/dev/null || echo "no summary.json"

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.event_name }}-${{ github.sha }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 7

  # =====================================================================
  # Job 2：nightly（schedule + 手动选 nightly）
  # =====================================================================
  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.inputs.run_type == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright system deps + MCP 浏览器
        run: |
          # 先装 Chromium system deps（libgtk / xvfb / fonts 等）
          npx playwright install-deps chromium 2>&1 || true
          # 再装 @playwright/mcp 需要的 chrome-for-testing（它用的不是普通 Chromium）
          npx @playwright/mcp install-browser chrome-for-testing

      - name: Setup CI config
        run: cp config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run demo_checkout.yaml（7 条全量）
        id: run
        env:
          STAGENT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/ci_run.py suites/demo_checkout.yaml; echo "exit_code=$?"

      - name: Print report on failure
        if: steps.run.outcome != 'success'
        run: |
          echo "=== artifacts dir ==="
          find artifacts -type f 2>/dev/null || echo "no artifacts"
          echo ""
          echo "=== report.md ==="
          cat artifacts/runs/*/report.md 2>/dev/null || echo "no report.md"
          echo ""
          echo "=== summary.json ==="
          cat artifacts/runs/*/summary.json 2>/dev/null || echo "no summary.json"

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 30
