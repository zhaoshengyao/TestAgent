# =====================================================================
# GitHub Actions CI（self-hosted runner on Windows）
#
# 触发：
#   - PR / push 到 main → smoke_login.yaml（PR 门禁）
#   - 每天 UTC 22:00 → demo_checkout.yaml（nightly 全量）
#   - 手动 Run workflow → 可选 smoke / nightly
#
# Runner 要求：
#   - Windows（当前机器）
#   - 已注册为 self-hosted runner，标签 testagent-windows
#   - 系统 PATH 里有 Python 3.11+ 和 Node 20+（setup-python/setup-node 在 Windows
#     self-hosted 上需要管理员权限写注册表，会炸，所以直接用系统装的）
#   - 已能访问内网千问端点（base_url + api_key 走 GitHub Secret）
#   - Playwright 浏览器首次跑会自动装 chrome-for-testing（~100MB）
#
# exit code 翻译（scripts/ci_run.py）：
#   CLI 0 / 2 → CI 绿，CLI 1 → CI 红
#
# 注意：不走 python -m pip install -e . —— editable install 劫持 import
# selftest / ci_run.py 自己做 Path(__file__).resolve().parents[1] 插入 sys.path
# workflow_dispatch inputs 用 inputs.run_type
# =====================================================================

name: TestAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: 跑哪种
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - nightly

jobs:
  # =====================================================================
  # Job 1：smoke（PR / push / 手动选 smoke）
  # =====================================================================
  smoke:
    if: >
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.run_type == 'smoke')
    runs-on: [self-hosted, testagent-windows]
    timeout-minutes: 15
    defaults:
      env:
        PYTHONUTF8: "1"
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python / Node
        run: |
          python --version
          node --version

      - name: Install Python deps
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright MCP browser
        run: npx @playwright/mcp install-browser chrome-for-testing

      - name: Setup CI config
        run: Copy-Item config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run smoke_login.yaml
        id: run
        env:
          STAGENT_API_KEY: ${{ secrets.STAGENT_API_KEY }}
          STAGENT_BASE_URL: ${{ secrets.STAGENT_BASE_URL }}
          STAGENT_MODEL: ${{ secrets.STAGENT_MODEL }}
        run: python scripts/ci_run.py suites/smoke_login.yaml; Write-Output "exit_code=$LASTEXITCODE"

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.event_name }}-${{ github.sha }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 7

  # =====================================================================
  # Job 2：nightly（schedule + 手动选 nightly）
  # =====================================================================
  nightly:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_type == 'nightly')
    runs-on: [self-hosted, testagent-windows]
    timeout-minutes: 45
    defaults:
      env:
        PYTHONUTF8: "1"
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python / Node
        run: |
          python --version
          node --version

      - name: Install Python deps
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install Playwright MCP browser
        run: npx @playwright/mcp install-browser chrome-for-testing

      - name: Setup CI config
        run: Copy-Item config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run demo_checkout.yaml
        id: run
        env:
          STAGENT_API_KEY: ${{ secrets.STAGENT_API_KEY }}
          STAGENT_BASE_URL: ${{ secrets.STAGENT_BASE_URL }}
          STAGENT_MODEL: ${{ secrets.STAGENT_MODEL }}
        run: python scripts/ci_run.py suites/demo_checkout.yaml; Write-Output "exit_code=$LASTEXITCODE"

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.event_name }}-${{ github.sha }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 7
