# =====================================================================
# GitHub Actions CI：PR smoke + nightly full
#
# 触发：
#   - PR / push 到 main → smoke_login.yaml（~5min，PR 门禁）
#   - 每天 UTC 22:00 → demo_checkout.yaml（~30min，nightly 全量）
#   - 手动 Run workflow → 可选 smoke / nightly
#
# 依赖：
#   - GitHub Secret DEEPSEEK_API_KEY
#   - ubuntu-latest + Node + npx playwright install（官方推荐方式）
#
# exit code 翻译（scripts/ci_run.py）：
#   CLI 0 / 2 → CI 绿，CLI 1 → CI 红
# =====================================================================

name: TestAgent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      run_type:
        description: 跑哪种
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - nightly

jobs:
  # =====================================================================
  # Job 1：smoke（PR / push / 手动选 smoke）
  # =====================================================================
  smoke:
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || github.inputs.run_type == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .

      - name: Install Playwright system deps（Chromium 需要）
        # ubuntu-latest 默认没有 libgtk / xvfb / fonts 等
        # @playwright/mcp 第一次启动会自动下载 Chromium 二进制
        # 但 system deps 必须提前装，否则 Chromium 会崩溃
        run: |
          npx playwright install-deps chromium 2>&1 || \
          (npm install -g playwright && npx playwright install-deps chromium)

      - name: Setup CI config + API key
        run: cp config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run smoke_login.yaml
        env:
          STAGENT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/ci_run.py suites/smoke_login.yaml

      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.event_name }}-${{ github.sha }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 7

  # =====================================================================
  # Job 2：nightly（schedule + 手动选 nightly）
  # =====================================================================
  nightly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.inputs.run_type == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -e .

      - name: Install Playwright system deps（Chromium 需要）
        # ubuntu-latest 默认没有 libgtk / xvfb / fonts 等
        # @playwright/mcp 第一次启动会自动下载 Chromium 二进制
        # 但 system deps 必须提前装，否则 Chromium 会崩溃
        run: |
          npx playwright install-deps chromium 2>&1 || \
          (npm install -g playwright && npx playwright install-deps chromium)

      - name: Install Playwright + Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Setup CI config + API key
        run: cp config.ci.example.yaml config.yaml

      - name: Run selftest
        run: python scripts/selftest.py

      - name: Run demo_checkout.yaml（7 条全量）
        env:
          STAGENT_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/ci_run.py suites/demo_checkout.yaml

      - name: Upload nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: artifacts/runs/*/
          if-no-files-found: ignore
          retention-days: 30
