      4. 确认登录成功（URL 跳转 / 出现退出按钮 / 出现用户信息）
      5. 截图
    assertions:
      - "登录后 URL 变化（跳转到非登录页）"
      - "页面出现退出按钮或用户信息"
    timeout_s: 1800

