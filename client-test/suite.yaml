# TestAgent 用例集（stagent init 自动生成）
name: 192.168.2.68:6088 回归测试
app_url: "https://192.168.2.68:6088/"
standard_username: "admin"
standard_password: "admin123"

cases:
  # ── 登录冒烟（自动生成）──
  - name: "登录冒烟"
    url: https://192.168.2.68:6088/
    instruction: |
      用 admin / admin123 登录。
      步骤：
      1. 打开 https://192.168.2.68:6088/
      2. 填充用户名和密码
      3. 点击登录
      4. 确认登录成功（URL 跳转 / 出现退出按钮 / 出现用户信息）
      5. 截图
    assertions:
      - "登录后 URL 变化（跳转到非登录页）"
      - "页面出现退出按钮或用户信息"
    timeout_s: 1800

