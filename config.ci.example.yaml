# =====================================================================
# CI 环境专用配置（self-hosted runner on Windows，内网千问）
#
# LLM 配置走环境变量注入，不硬编码：
#   STAGENT_API_KEY    ← GitHub Secret
#   STAGENT_BASE_URL   ← GitHub Secret（内网千问端点，如 http://192.168.2.10:3000/v1）
#   STAGENT_MODEL      ← GitHub Secret（如 Qwen3.8-27B-FP8）
#
# config.py 优先级链：yaml pick() → STAGENT_* env → OPENAI_API_KEY env → provider preset
# 所以 yaml 里留空，env 一注入就生效。
# =====================================================================

llm:
  provider: custom
  base_url: ""
  model: ""
  api_key: ""
  temperature: 0.2
  max_tokens: 4096
  timeout_s: 240
  # 内网网关限流，给足退避空间
  min_interval_s: 0.5
  max_attempts: 5
  base_delay_s: 1.0
  max_delay_s: 16.0

browser:
  command: ""
  args:
    - "@playwright/mcp@latest"
  headless: true
  output_dir: artifacts/screens
  startup_timeout_s: 120
  tool_timeout_s: 60
  extra_args:
    - "--browser=chromium"

agent:
  max_steps: 40
  heal_attempts: 2
  auto_observe: true
  tool_result_char_limit: 6000
  screenshot_each_step: true
