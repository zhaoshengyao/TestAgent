[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagent"
version = "0.1.0"
description = "自然语言驱动的 Web UI 回归测试智能体"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "openai",
    "mcp",
]

[tool.setuptools.packages.find]
include = ["stagent*"]
